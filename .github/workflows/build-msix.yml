name: Build distributions

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0）'
        required: true
        default: '0.7.1'
      create_release:
        description: '构建完成后发布便携 ZIP'
        type: boolean
        default: false
      sign_msix:
        description: '使用 GitHub Secrets 中的 MSIX 证书签名'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate and apply version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw '版本号必须使用 major.minor.patch 格式' }
          [xml]$manifest = Get-Content 'Package.appxmanifest'
          $manifest.Package.Identity.Version = "$version.0"
          $manifest.Save((Resolve-Path 'Package.appxmanifest'))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore and test
        run: |
          dotnet restore Flux.slnx
          dotnet test tests/Flux.Tests/Flux.Tests.csproj -c Release

      - name: Publish privileged service payloads
        shell: pwsh
        run: |
          foreach ($rid in 'win-x86', 'win-x64', 'win-arm64') {
            $root = "service-artifacts\$rid"
            dotnet publish Flux.Service/Flux.Service.csproj -c Release -r $rid --self-contained true -p:Version=${{ steps.version.outputs.version }} -o "$root\service-payload"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet publish Flux.Service.Installer/Flux.Service.Installer.csproj -c Release -r $rid --self-contained true -p:Version=${{ steps.version.outputs.version }} -o "$root\installer"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -LiteralPath "$root\installer\Flux.Service.Installer.exe" -Destination "$root\Flux.Service.Installer.exe"
            foreach ($required in @("$root\Flux.Service.Installer.exe", "$root\service-payload\Flux.Service.exe", "$root\service-payload\core\mihomo.exe")) {
              if (!(Test-Path -LiteralPath $required)) { throw "服务发行载荷缺失: $required" }
            }
          }

      - name: Publish portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in 'win-x86', 'win-x64', 'win-arm64') {
            $output = "portable\$rid"
            $payload = (Resolve-Path "service-artifacts\$rid").Path
            dotnet publish Flux.csproj -c Release -r $rid --self-contained true -p:WindowsPackageType=None -p:Version=${{ steps.version.outputs.version }} -p:ServicePayloadDir="$payload" -o $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "$output\*" -DestinationPath "artifacts\Flux-$rid-v${{ steps.version.outputs.version }}.zip"
          }

      - name: Import MSIX signing certificate
        if: ${{ inputs.sign_msix }}
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_PASSWORD)) {
            throw 'sign_msix=true 时必须配置 MSIX_CERTIFICATE_BASE64 和 MSIX_CERTIFICATE_PASSWORD 两个 GitHub Actions secrets。'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'msix-signing-certificate.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:MSIX_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          if ($certificate.Subject -ne 'CN=98115004-601A-4933-A2AC-7F81FB1DAD0A') {
            throw '签名证书的 Subject 与 Microsoft Store 分配的 Package/Identity/Publisher 不匹配。'
          }
          "certificate_path=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "certificate_thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSIX
        shell: pwsh
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $architectures = @(
            @{ Rid = 'win-x86'; Platform = 'x86' },
            @{ Rid = 'win-x64'; Platform = 'x64' },
            @{ Rid = 'win-arm64'; Platform = 'ARM64' }
          )
          foreach ($architecture in $architectures) {
            $publishArguments = @(
              'publish', 'Flux.csproj', '-c', 'Release', '-r', $architecture.Rid, "-p:Platform=$($architecture.Platform)",
              "-p:Version=${{ steps.version.outputs.version }}", "-p:ServicePayloadDir=$((Resolve-Path "service-artifacts\$($architecture.Rid)").Path)",
              '-p:WindowsPackageType=MSIX', '-p:EnableMsixTooling=true',
              '-p:UapAppxPackageBuildMode=SideloadOnly', '-p:GenerateAppxPackageOnBuild=true',
              '-p:AppxBundle=Never', "-p:AppxPackageDir=$env:GITHUB_WORKSPACE\msix\$($architecture.Rid)\"
            )
            if ('${{ inputs.sign_msix }}' -eq 'true') {
              $publishArguments += '-p:AppxPackageSigningEnabled=true'
              $publishArguments += "-p:PackageCertificateThumbprint=$env:certificate_thumbprint"
            }
            else {
              $publishArguments += '-p:AppxPackageSigningEnabled=false'
            }
            & dotnet @publishArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package signed sideload ZIP
        if: ${{ inputs.sign_msix }}
        shell: pwsh
        run: |
          foreach ($rid in 'win-x86', 'win-x64', 'win-arm64') {
            $stagingDirectory = Join-Path $env:RUNNER_TEMP "flux-sideload-$rid"
            $zipPath = "artifacts\Flux-sideload-$rid-v${{ steps.version.outputs.version }}.zip"
            New-Item -ItemType Directory -Force "$stagingDirectory\packages" | Out-Null
            Copy-Item -Path "msix\$rid" -Destination "$stagingDirectory\packages\$rid" -Recurse
            Copy-Item -Path 'scripts\Install-FluxSideload.ps1' -Destination "$stagingDirectory\Install-FluxSideload.ps1"
            Export-Certificate -Cert "Cert:\CurrentUser\My\$env:certificate_thumbprint" -FilePath "$stagingDirectory\Flux.cer" -Force | Out-Null
            Compress-Archive -Path "$stagingDirectory\*" -DestinationPath $zipPath -Force
            # Verify the final ZIP using the same discovery logic as installation.
            $verificationDirectory = Join-Path $env:RUNNER_TEMP "flux-sideload-verify-$rid"
            Expand-Archive -LiteralPath $zipPath -DestinationPath $verificationDirectory
            & "$verificationDirectory\Install-FluxSideload.ps1" -VerifyOnly -RuntimeIdentifier $rid
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$verificationDirectory\Install-FluxSideload.ps1" -VerifyOnly -RuntimeIdentifier $rid
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 侧载包校验失败：$rid" }
          }

      - name: Remove MSIX signing certificate
        if: ${{ always() && inputs.sign_msix }}
        shell: pwsh
        run: |
          if ($env:certificate_path -and (Test-Path -LiteralPath $env:certificate_path)) {
            Remove-Item -LiteralPath $env:certificate_path -Force
          }
          if ($env:certificate_thumbprint) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:certificate_thumbprint" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Flux-portable-v${{ steps.version.outputs.version }}
          path: artifacts/Flux-win-*.zip
          if-no-files-found: error

      - name: Upload signed sideload ZIP
        if: ${{ inputs.sign_msix }}
        uses: actions/upload-artifact@v4
        with:
          name: Flux-sideload-v${{ steps.version.outputs.version }}
          path: artifacts/Flux-sideload-*.zip
          if-no-files-found: error

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-msix-v${{ steps.version.outputs.version }}
          path: msix/**/*.msix
          if-no-files-found: error

      - name: Release signed MSIX application
        if: ${{ inputs.create_release && inputs.sign_msix }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flux v${{ steps.version.outputs.version }}
          body: |
            ## English

            Download the signed MSIX package for your Windows architecture (x86, x64, or ARM64), or download the sideload ZIP.
            The sideload ZIP includes a certificate and `Install-FluxSideload.ps1`. Extract the ZIP and run the script as administrator to install the package that matches your system architecture.

            ## 简体中文

            下载与 Windows 架构匹配的已签名 MSIX 安装包（x86、x64 或 ARM64），或下载侧载 ZIP。
            侧载 ZIP 内含证书和 `Install-FluxSideload.ps1`；解压后，以管理员身份运行该脚本即可安装匹配当前系统架构的包。

            ## 日本語

            Windows のアーキテクチャ（x86、x64、ARM64）に対応する署名済み MSIX パッケージ、またはサイドロード用 ZIP をダウンロードしてください。
            サイドロード用 ZIP には証明書と `Install-FluxSideload.ps1` が含まれています。ZIP を展開し、スクリプトを管理者として実行すると、システムのアーキテクチャに対応するパッケージをインストールできます。

            ## 한국어

            Windows 아키텍처(x86, x64 또는 ARM64)에 맞는 서명된 MSIX 패키지 또는 사이드로드용 ZIP을 다운로드하세요.
            사이드로드용 ZIP에는 인증서와 `Install-FluxSideload.ps1`이 포함되어 있습니다. ZIP의 압축을 푼 뒤 스크립트를 관리자 권한으로 실행하면 시스템 아키텍처에 맞는 패키지가 설치됩니다.
          files: |
            msix/**/*.msix
            artifacts/Flux-sideload-*.zip
          draft: false
          prerelease: false
