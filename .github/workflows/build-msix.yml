name: Build distributions

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0）'
        required: true
        default: '0.1.0'
      create_release:
        description: '构建完成后发布便携 ZIP'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate and apply version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw '版本号必须使用 major.minor.patch 格式' }
          [xml]$manifest = Get-Content 'Package.appxmanifest'
          $manifest.Package.Identity.Version = "$version.0"
          $manifest.Save((Resolve-Path 'Package.appxmanifest'))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore and test
        run: |
          dotnet restore Flux.slnx
          dotnet test tests/Flux.Tests/Flux.Tests.csproj -c Release

      - name: Publish portable application
        shell: pwsh
        run: |
          dotnet publish Flux.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -o portable
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path portable\* -DestinationPath "artifacts\Flux-win-x64-v${{ steps.version.outputs.version }}.zip"

      # 此 MSIX 未签名，只作为开发测试产物，不上传到公开 Release。
      - name: Build unsigned MSIX for testing
        run: >
          dotnet publish Flux.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:WindowsPackageType=MSIX -p:EnableMsixTooling=true
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never
          -p:AppxPackageDir="${{ github.workspace }}\msix\"

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Flux-win-x64-v${{ steps.version.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload unsigned MSIX test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-unsigned-msix-v${{ steps.version.outputs.version }}
          path: msix/**/*.msix
          if-no-files-found: error

      - name: Release portable application
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flux v${{ steps.version.outputs.version }}
          body: |
            下载便携 ZIP，解压后运行 Flux.exe。MSIX 测试产物未签名，不作为公开安装包发布。
          files: artifacts/*.zip
          draft: false
          prerelease: false
