name: Build MSIX

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后自动发布 Release'
        type: boolean
        default: true
  # push:
    # branches: [main]
    # tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from Package.appxmanifest
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "Package.appxmanifest"
          $version = $manifest.Package.Identity.Version
          Write-Host "Package version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore Flux.csproj -r win-x64

      - name: Build MSIX package
        run: >
          dotnet publish Flux.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:WindowsPackageType=MSIX
          -p:EnableMsixTooling=true
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxBundle=Never
          -p:AppxPackageDir="${{ github.workspace }}\msix\"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-msix-v${{ steps.version.outputs.version }}
          path: msix/**/*.msix
          if-no-files-found: error

      - name: Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flux v${{ steps.version.outputs.version }}
          body: |
            Flux v${{ steps.version.outputs.version }}

            安装方式：下载 MSIX 包后双击安装（未签名包需开启开发者模式或信任证书）。
          files: msix/**/*.msix
          draft: false
          prerelease: false
