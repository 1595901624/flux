name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Flux.slnx
      - name: Build
        run: dotnet build Flux.slnx -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test tests/Flux.Tests/Flux.Tests.csproj -c Release --no-build
      - name: Audit NuGet packages
        run: dotnet list Flux.csproj package --vulnerable --include-transitive
